name: Build

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

# GitHub 上推送 ghcr.io 需要 packages: write
permissions:
  contents: read
  packages: write

# Forgejo Variables 不自动注入 shell, 统一映射到 env
env:
  NUGET_SOURCE: ${{ vars.NUGET_SOURCE }}
  BASE_IMAGE: ${{ vars.BASE_IMAGE }}
  JELLYFIN_MIRROR_URL: ${{ vars.JELLYFIN_MIRROR_URL }}
  SDK_IMAGE_REPO: ${{ vars.SDK_IMAGE_REPO }}
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
  USE_MIRROR: ${{ vars.USE_MIRROR }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    container:
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Clone
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" .
          if [ -n "${JELLYFIN_MIRROR_URL:-}" ]; then
            git config submodule.jellyfin.url "$JELLYFIN_MIRROR_URL"
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          MIRROR_TOKEN="${{ secrets.JELLYFIN_MIRROR_TOKEN }}"
          if [ -n "$MIRROR_TOKEN" ]; then
            git config --global url."https://${OWNER}:${MIRROR_TOKEN}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"
          fi
          git submodule update --init

      - name: Apply patches
        run: |
          set -eo pipefail
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
          cd jellyfin
          git checkout -q "$(git describe --tags --abbrev=0)"
          for p in ../patches/*.patch; do
            git am --committer-date-is-author-date "$p" \
              || { echo "补丁失败: $p"; git am --abort; exit 1; }
          done
          echo "补丁应用成功"

      - name: Docker login
        run: |
          set -eo pipefail
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "${{ secrets.JELLYFIN_MIRROR_TOKEN }}" \
              | docker login "${GITHUB_SERVER_URL#https://}" -u "${GITHUB_REPOSITORY%%/*}" --password-stdin
          fi

      - name: Compile
        run: |
          set -eo pipefail
          NUGET_SOURCE="${NUGET_SOURCE:-https://api.nuget.org/v3/index.json}"
          # SDK 版本从 jellyfin/global.json 推导 (如 10.0 -> sdk:10.0)
          SDK_VER=$(sed -n 's/.*"version": "\([0-9]*\.[0-9]*\).*/\1/p' jellyfin/global.json)
          if [ "${USE_MIRROR:-false}" = "true" ]; then
            # 内网 registry 的 arm64 SDK 镜像 (变量 SDK_IMAGE_REPO, 不含 tag)
            if [ -z "${SDK_IMAGE_REPO:-}" ]; then
              echo "错误: USE_MIRROR=true 需要设置变量 SDK_IMAGE_REPO (内网 arm64 SDK 镜像 repo, 不含 tag)"; exit 1
            fi
            SDK_IMAGE="${SDK_IMAGE_REPO}:${SDK_VER}"
          else
            SDK_IMAGE="mcr.microsoft.com/dotnet/sdk:${SDK_VER}"
          fi
          echo "使用 $SDK_IMAGE"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="mirror" value="%s" />\n  </packageSources>\n</configuration>\n' \
            "$NUGET_SOURCE" > jellyfin/nuget.config
          mkdir -p publish
          # dind daemon 看不见 job 容器的 bind mount, 源码/产物改走 docker cp (API 传输)
          docker run -d --name compile --workdir /src "$SDK_IMAGE" sleep infinity
          trap 'docker rm -f compile >/dev/null 2>&1 || true' EXIT
          docker exec compile mkdir -p /src /out
          tar -C jellyfin --exclude=.git -cf - . | docker cp - compile:/src
          docker exec --workdir /src compile \
            dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
              -c Release -o /out \
              --self-contained true \
              --runtime linux-arm64
          docker cp compile:/out/. publish/
          ls -la publish/MediaBrowser.Common.dll

      - name: Build image
        run: |
          set -eo pipefail
          # 上游版本永远从 submodule 取; 镜像 tag: v* 触发用发布 tag 名, 否则 上游-cix
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"; TAG="${TAG#v}"
          else
            TAG="${UPSTREAM_TAG}-cix"
          fi
          # mirror 模式: daocloud 多架构代理 (自动选 arm64);
          # 直连模式: docker.io 官方多架构 tag
          BASE_IMAGE="${BASE_IMAGE:-jellyfin/jellyfin}"
          if [ "${USE_MIRROR:-false}" = "true" ]; then
            BASE_REF="docker.m.daocloud.io/${BASE_IMAGE}:${UPSTREAM_TAG}"
          else
            BASE_REF="docker.io/${BASE_IMAGE}:${UPSTREAM_TAG}"
          fi
          docker build \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --build-arg USE_MIRROR="${USE_MIRROR:-false}" \
            -t "jellyfin-cix:${TAG}" \
            -t "jellyfin-cix:latest" .

      - name: Push
        run: |
          set -eo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"; TAG="${TAG#v}"
          else
            UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
            TAG="${UPSTREAM_TAG}-cix"
          fi
          # GitHub -> ghcr.io; 内网 -> REGISTRY_IMAGE 变量 (缺省为 <SERVER>/<REPOSITORY>)
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_REF="ghcr.io/${OWNER}/jellyfin-cix"
          else
            IMAGE_REF="${REGISTRY_IMAGE:-${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}}"
          fi
          docker tag "jellyfin-cix:${TAG}" "$IMAGE_REF:${TAG}"
          docker tag "jellyfin-cix:latest" "$IMAGE_REF:latest"
          docker push "$IMAGE_REF:${TAG}"
          docker push "$IMAGE_REF:latest"
