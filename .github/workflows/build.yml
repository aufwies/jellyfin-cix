name: Build

on:
  push:
    branches: [main]
  pull_request:

# 所有 mirror 通过 Forgejo 仓库变量或 runner 环境变量配置:
#   SDK_IMAGE        - dotnet SDK 容器镜像
#   BASE_IMAGE       - jellyfin 基础镜像
#   NUGET_SOURCE     - NuGet 包源
#   JELLYFIN_MIRROR_URL - submodule 源 (可选, 默认用 .gitmodules)

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        run: |
          S=""; [ "$(id -u)" = "0" ] || S="sudo"
          $S apt-get update -qq
          $S apt-get install -y -qq git curl patch podman

      - name: Clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" .
          if [ -n "${JELLYFIN_MIRROR_URL:-}" ]; then
            git config submodule.jellyfin.url "$JELLYFIN_MIRROR_URL"
          fi
          # 注入认证: submodule 拉取需要访问其他仓库
          if [[ "$GITHUB_SERVER_URL" != *github.com* ]]; then
            git config --global url."https://rgan:${{ secrets.PUBLISH_TOKEN }}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"
          fi
          git submodule update --init

      - name: Apply patches
        run: |
          cd jellyfin
          UPSTREAM_TAG=$(git describe --tags --abbrev=0)
          git checkout -q "$UPSTREAM_TAG"
          for p in ../patches/*.patch; do
            git am --committer-date-is-author-date "$p" \
              || { echo "补丁失败: $p"; git am --abort; exit 1; }
          done

      - name: Compile (SDK 容器)
        run: |
          cat > /tmp/nuget.config <<NESTED
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="mirror" value="${NUGET_SOURCE}" />
            </packageSources>
          </configuration>
          NESTED
          cp /tmp/nuget.config jellyfin/nuget.config

          podman run --rm --network=host \
            -v "$PWD/jellyfin:/src" \
            -v "$PWD/publish:/out" \
            -w /src \
            "${SDK_IMAGE}" \
            dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
              -c Release -o /out \
              -p:UseAppHost=false

      - name: Build image
        run: |
          export PATH="/usr/local/bin:$PATH"
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"
          podman build --layers=false \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            -t "jellyfin-cix:${TAG}" .

      - name: Push (internal only)
        run: |
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            echo "GitHub 环境, 跳过内部推送"
            exit 0
          fi
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"
          REGISTRY_HOST="${GITHUB_SERVER_URL#https://}"
          podman login "$REGISTRY_HOST" -u rgan -p "${{ secrets.PUBLISH_TOKEN }}"
          podman tag "jellyfin-cix:${TAG}" "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
          podman push "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
