name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  BASE_REGISTRY: docker.io

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        run: |
          S=""; [ "$(id -u)" = "0" ] || S="sudo"
          $S apt-get update -qq
          $S apt-get install -y -qq git curl ca-certificates

      - name: Clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" .
          git submodule update --init

      - name: Apply patches
        run: |
          cd jellyfin
          UPSTREAM_TAG=$(git describe --tags --abbrev=0)
          git checkout -q "$UPSTREAM_TAG"
          for p in ../patches/*.patch; do
            [ -f "$p" ] || { echo "无补丁"; exit 1; }
            git am --committer-date-is-author-date "$p" \
              || { echo "补丁失败: $p"; git am --abort; exit 1; }
          done

      - name: dotnet publish
        run: |
          if ! command -v dotnet >/dev/null; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir "$HOME/.dotnet"
          fi
          export PATH="$HOME/.dotnet:$PATH"
          dotnet publish jellyfin/Jellyfin.Server/Jellyfin.Server.csproj -c Release -o publish

      - name: Build image
        run: |
          # 检测可用的容器工具 (GitHub 有 docker, Forgejo runner 可能是 podman)
          if command -v docker >/dev/null; then OCI=docker; else OCI=podman; fi
          export PATH="/usr/local/bin:$PATH"
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"
          # 内部环境用镜像源, GitHub 直连
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            REG="${BASE_REGISTRY}"
          else
            REG="docker.m.daocloud.io"
          fi
          $OCI build --build-arg BASE_REGISTRY="$REG" -t "jellyfin-cix:${TAG}" .

      - name: Push to Forgejo registry (internal only)
        run: |
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            echo "GitHub 环境, 跳过内部推送"
            exit 0
          fi
          if ! command -v podman >/dev/null; then
            S=""; [ "$(id -u)" = "0" ] || S="sudo"; $S apt-get install -y -qq podman
          fi
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"
          REGISTRY_HOST="${GITHUB_SERVER_URL#https://}"
          podman login "$REGISTRY_HOST" -u rgan -p "${{ secrets.PUBLISH_TOKEN }}"
          podman tag "jellyfin-cix:${TAG}" "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
          podman push "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
