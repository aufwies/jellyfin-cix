name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  # 内部环境覆盖为镜像源; GitHub 直连
  BASE_REGISTRY: docker.io

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        run: |
          S=""; [ "$(id -u)" = "0" ] || S="sudo"
          $S apt-get update -qq
          $S apt-get install -y -qq git curl ca-certificates

      - name: Clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" .
          # submodule 地址可通过 JELLYFIN_MIRROR_URL 环境变量覆盖
          if [ -n "${JELLYFIN_MIRROR_URL:-}" ]; then
            git config submodule.jellyfin.url "$JELLYFIN_MIRROR_URL"
          fi
          # 内部环境: 用 PUBLISH_TOKEN 认证 git 操作
          if [[ "$GITHUB_SERVER_URL" != *github.com* ]]; then
            git config --global url."https://rgan:${{ secrets.PUBLISH_TOKEN }}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"
          fi
          git submodule update --init

      - name: Build image
        run: |
          if command -v docker >/dev/null; then OCI=docker; else OCI=podman; fi
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"

          # 内部环境用镜像源
          if [[ "$GITHUB_SERVER_URL" != *github.com* ]]; then
            export BASE_REGISTRY=docker.m.daocloud.io
          fi

          $OCI build \
            --build-arg SDK_IMAGE="${SDK_IMAGE:-git.example.com/rgan/dotnet-sdk:9.0}" \
            --build-arg BASE_REGISTRY="$BASE_REGISTRY" \
            -t "jellyfin-cix:${TAG}" .

      - name: Push to Forgejo registry (internal only)
        run: |
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            echo "GitHub 环境, 跳过内部推送"
            exit 0
          fi
          if ! command -v podman >/dev/null; then
            S=""; [ "$(id -u)" = "0" ] || S="sudo"; $S apt-get install -y -qq podman
          fi
          UPSTREAM_TAG=$(cd jellyfin && git describe --tags --abbrev=0 | sed 's/^v//')
          TAG="${UPSTREAM_TAG}-cix.1"
          REGISTRY_HOST="${GITHUB_SERVER_URL#https://}"
          podman login "$REGISTRY_HOST" -u rgan -p "${{ secrets.PUBLISH_TOKEN }}"
          podman tag "jellyfin-cix:${TAG}" "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
          podman push "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
