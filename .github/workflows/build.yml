name: Build

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Socket check
        run: |
          command -v docker
          docker info --format 'server={{.ServerVersion}} driver={{.Driver}}'


