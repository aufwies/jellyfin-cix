name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Push image
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        run: |
          S=""; [ "$(id -u)" = "0" ] || S="sudo"
          $S apt-get update -qq
          $S apt-get install -y -qq git curl patch podman

      - name: Clone
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" .
          if [ -n "${JELLYFIN_MIRROR_URL:-}" ]; then
            git config submodule.jellyfin.url "$JELLYFIN_MIRROR_URL"
          fi
          git submodule update --init

      - name: Apply patches
        run: |
          cd jellyfin
          UPSTREAM_TAG=$(git describe --tags --abbrev=0)
          git checkout -q "$UPSTREAM_TAG"
          for p in ../patches/*.patch; do
            git am --committer-date-is-author-date "$p" \
              || { echo "补丁失败: $p"; git am --abort; exit 1; }
          done

      - name: Compile (SDK 容器)
        run: |
          cat > /tmp/nuget.config <<NESTED
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="mirror" value="${NUGET_SOURCE}" />
            </packageSources>
          </configuration>
          NESTED
          cp /tmp/nuget.config jellyfin/nuget.config

          podman run --rm \
            -v "$PWD/jellyfin:/src" \
            -v "$PWD/publish:/out" \
            -w /src \
            "${SDK_IMAGE}" \
            dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
              -c Release -o /out \
              -p:UseAppHost=false

      - name: Build image
        run: |
          export PATH="/usr/local/bin:$PATH"
          TAG="${GITHUB_REF_NAME#v}"
          podman build --layers=false \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            -t "jellyfin-cix:${TAG}" .

      - name: Push (internal only)
        run: |
          if [[ "$GITHUB_SERVER_URL" == *github.com* ]]; then
            echo "GitHub 环境, 跳过"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          REGISTRY_HOST="${GITHUB_SERVER_URL#https://}"
          podman login "$REGISTRY_HOST" -u rgan -p "${{ secrets.PUBLISH_TOKEN }}"
          podman tag "jellyfin-cix:${TAG}" "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
          podman push "$REGISTRY_HOST/rgan/jellyfin-cix:${TAG}"
